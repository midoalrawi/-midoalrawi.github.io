<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يلا تاكسي | تحت الصيانة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1b3e 0%, #1a2f5e 50%, #0d1b3e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* الطريق المتحرك أسفل الصفحة */
        .road {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: #0a1330;
            border-top: 3px solid #f5c518;
            overflow: hidden;
        }

        .road::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 200%;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                #f5c518 0px,
                #f5c518 60px,
                transparent 60px,
                transparent 120px
            );
            animation: roadMove 1.2s linear infinite;
        }

        @keyframes roadMove {
 0% { transform: translateX(0); }
            100% { transform: translateX(-120px); }
        }

        /* سيارة تاكسي متحركة */
        .taxi {
            position: fixed;
            bottom: 40px;
            font-size: 60px;
            animation: drive 8s linear infinite;
            z-index: 10;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        @keyframes drive {
            0% { right: -120px; }
            100% { right: 110%; }
        }

        /* دوائر متوهجة في الخلفية */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #f5c518;
            top: -100px;
            right: -100px;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: #2a4a8f;
            bottom: -150px;
            left: -150px;
            animation-delay: 3s;
        }

        @keyframes float {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(40px) scale(1.15); }
        }

        /* الحاوية الرئيسية */
        .container {
            text-align: center;
            z-index: 5;
            padding: 40px 20px;
            max-width: 700px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* أيقونة الإعدادات الدوارة */
        .gear-icon {
            font-size: 80px;
            display: inline-block;
            animation: spin 4s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            { transform: rotate(360deg); }
        }

        .logo-badge {
            display: inline-block;
            background: rgba(245, 197, 24, 0.1);
            border: 2px solid #f5c518;
            color: #f5c518;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 60px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 15px;
        }

        h1 span {
            color: #f5c518;
        }

        .subtitle {
            font-size: 20px;
            color: #a8b6d8;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        /* شريط التقدم */
        .progress-wrapper {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 6px;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
        }

        .progress-bar {
            height: 20px;
            background: linear-gradient(90deg, #f5c518, #ffdd55, #f5c518);
            border-radius: 50px;
            width: 0%;
            animation: progress 3s ease-out forwards;
            box-shadow: 0 0 15px rgba(245, 197, 24, 0.6);
            position: relative;
        }

        @keyframes progress {
            to { width: 78%; }
        }

        .progress-text {
            color: #f5c518;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 45px;
        }

        /* العد التنازلي */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 45px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(245, 197, 24, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px 15px;
            min-width: 100px;
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-8px);
            border-color: #f5c518;
        }

        .time-num {
            font-size: 40px;
            font-weight: 900;
            color: #f5c518;
            line-height: 1;
        }

        .time-label {
            color: #a8b6d8;
            font-size: 14px;
            margin-top: 8px;
            font-weight: 600;
        }

        /* زر التواصل */
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #f5c518, #ffdf60);
            color: #0d1b3e;
            font-weight: 800;
            font-size: 18px;
            padding: 16px 50px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(245, 197, 24, 0.35);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 35px rgba(245, 197, 24, 0.5);
        }

        /* روابط السوشيال */
        .socials {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .socials a {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .socials a:hover {
            background: #f5c518;
            transform: translateY(-5px);
        }

        /* تجاوب مع الجوال */
        @media (max-width: 600px) {
            h1 { font-size: 40px; }
            .subtitle { font-size: 16px; }
            .time-box { min-width: 80px; padding: 15px 10px; }
            .time-num { font-size: 30px; }
            .btn { padding: 14px 40px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- سيارة التاكسي المتحركة -->
    <div class="taxi">🚕</div>

    <div class="container">

        <div class="gear-icon">⚙️</div>

        <div class="logo-badge">🚕 يلا تاكسي</div>

        <h1>نحن <span>نطوّر</span> التطبيق!</h1>

        <p class="subtitle">
            نعتذر عن الانقطاع المؤقت، فريقنا يعمل بجد على تطوير تجربة أفضل وأسرع لك.<br>
            سيكون الموقع متاحاً قريباً جداً 🔧
        </p>

        <!-- شريط التقدم -->
        <div class="progress-wrapper">
            <div class="progress-bar"></div>
        </div>
        <p class="progress-text">اكتملت نسبة 78% من التحديث</p>

        <!-- العد التنازلي -->
        <div class="countdown">
            <div class="time-box">
                <div class="time-num" id="days">00</div>
                <div class="time-label">يوم</div>
            </div>
            <div class="time-box">
                <div class="time-num" id="hours">00</div>
                <div class="time-label">ساعة</div>
            </div>
            <div class="time-box">
                <div class="time-num" id="minutes">00</div>
                <div class="time-label">دقيقة</div>
            </div>
            <div class="time-box">
                <div class="time-num" id="seconds">00</div>
                <div class="time-label">ثانية</div>
            </div>
        </div>

        <a href="mailto:support@yallataksi.com" class="btn">📧 تواصل معنا</a>

        <div class="socials">
            <a href="#" title="تويتر">𝕏</a>
            <a href="#" title="انستقرام">📷</a>
            <a href="#" title="فيسبوك">📘</a>
            <a href="#" title="واتساب">💬</a>
        </div>

    </div>

    <!-- الطريق أسفل الصفحة -->
    <div class="road"></div>

    <script>
        // العد التنازلي - عدل التاريخ حسب موعد الإطلاق
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 3); // بعد 3 أيام

        function updateCountdown() {
            const now = new Date();
            const diff = launchDate - now;

            if (diff <= 0) {
                document.querySelector('.container').innerHTML =
                    '<h1><span>🚕 عادنا!</span></h1><p class="subtitle">تم الانتهاء من الصيانة، مرحباً بكم في يلا تاكسي</p>';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
